name: Desktop host checks

on:
  pull_request:
    paths:
      - 'app/src/main/java/**'
      - 'app/src/test/java/**'
      - 'app/src/testSupport/**'
      - 'scripts/verify-host.py'
      - '.github/workflows/desktop-host-checks.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/test/java/**'
      - 'app/src/testSupport/**'
      - 'scripts/verify-host.py'
      - '.github/workflows/desktop-host-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify focused production-body fixtures
        run: |
          python3 scripts/verify-host.py --suite start --download-deps
          python3 scripts/verify-host.py --suite input
          python3 scripts/verify-host.py --suite parsers
          python3 scripts/verify-host.py --suite selection
      - name: Verify taskbar pin fixtures
        run: python3 scripts/verify-host.py --suite taskbar
